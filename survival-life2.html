<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Survival-Life 2 </title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
      background: rgba(255,255,255,0.8); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #hud {
      position: absolute; top: 10px; left: 10px; color: #fff; font-family: sans-serif;
      padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>Survival-Life 2</h1>
  <div id="crosshair"></div>
  <div id="hud">Здоровье: <span id="health">100</span><br>Убито врагов: <span id="kills">0</span></div>

  <!-- Подключаем Three.js через CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);
    scene.fog = new THREE.Fog(0x111115, 8, 40);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6; // высота глаз

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Освещение
    const light = new THREE.HemisphereLight(0xffffff, 0x444466, 2);
    scene.add(light);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(50, 50, 30);
    scene.add(dirLight);

    // Пол
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    floorGeo.rotateX(-Math.PI / 2);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    scene.add(floor);

    // Стены (простая комната)
    function makeWall(x, y, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const wall = new THREE.Mesh(geo, mat);
      wall.position.set(x, y, z);
      scene.add(wall);
    }
    makeWall(0, 1, -25, 50, 2, 1); // дальняя
    makeWall(0, 1, 25, 50, 2, 1);   // ближняя
    makeWall(-25, 1, 0, 1, 2, 50); // левая
    makeWall(25, 1, 0, 1, 2, 50);  // правая

    // Враги (кубы)
    const enemies = [];
    const enemyGeo = new THREE.BoxGeometry(1, 1, 1);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });

    for (let i = 0; i < 5; i++) {
      const e = new THREE.Mesh(enemyGeo, enemyMat);
      e.position.set((Math.random() - 0.5) * 20, 0.5, (Math.random() - 0.5) * 20);
      enemies.push(e);
      scene.add(e);
    }

    // Управление (PointerLock)
    const controls = new PointerLockControls(camera, document.body);

    const instructions = document.body;
    instructions.addEventListener('click', () => {
      controls.lock();
    });

    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;

    const onKeyDown = (event) => {
      switch (event.code) {
        case 'ArrowUp': case 'KeyW': moveForward = true; break;
        case 'ArrowDown': case 'KeyS': moveBackward = true; break;
        case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
        case 'ArrowRight': case 'KeyD': moveRight = true; break;
      }
    };

    const onKeyUp = (event) => {
      switch (event.code) {
        case 'ArrowUp': case 'KeyW': moveForward = false; break;
        case 'ArrowDown': case 'KeyS': moveBackward = false; break;
        case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
        case 'ArrowRight': case 'KeyD': moveRight = false; break;
      }
    };

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    // Стрельба
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    document.addEventListener('mousedown', (event) => {
      if (controls.isLocked) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(enemies);
        if (intersects.length > 0) {
          const hit = intersects[0].object;
          scene.remove(hit);
          enemies.splice(enemies.indexOf(hit), 1);
          document.getElementById('kills').innerText = parseInt(document.getElementById('kills').innerText) + 1;
        }
      }
    });

    // Анимация
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (controls.isLocked) {
        velocity.x = (-moveLeft + moveRight) * 15.0 * delta;
        velocity.z = (-moveForward + moveBackward) * 15.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) direction.multiplyScalar(15.0 * delta);
        if (moveLeft || moveRight) direction.multiplyScalar(15.0 * delta);

        controls.moveRight(-velocity.x);
        controls.moveForward(-velocity.z);
      }

      renderer.render(scene, camera);
    }

    animate();

    // Адаптация под размер окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
