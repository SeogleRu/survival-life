<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Survival-Life 2</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; }

    /* Прицел */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
      background: rgba(255,255,255,0.8); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }

    /* HUD */
    #hud {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-family: sans-serif; padding: 8px; background: rgba(0,0,0,0.6);
      border: 1px solid #444; z-index: 10;
    }

    /* Сообщение старта */
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-family: sans-serif; font-size: 24px; text-align: center;
      z-index: 20; display: flex; flex-direction: column; align-items: center;
      gap: 12px; background: rgba(0,0,0,0.8); padding: 20px 40px; border: 1px solid #555;
    }

    /* Кнопки управления (мобильные) */
    .mobile-controls { display: none; position: fixed; bottom: 20px; width: 100%; justify-content: space-between; padding: 0 20px; z-index: 5; }
    @media (max-width: 768px) { .mobile-controls { display: flex; } }

    .btn-group { display: flex; gap: 8px; }
    .btn {
      width: 60px; height: 60px; background: rgba(0,0,0,0.7);
      color: #fff; border: 2px solid #666; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; user-select: none; touch-action: manipulation;
    }
    .btn:active { background: #ff6666; transform: scale(0.95); }
    .btn.shoot { width: 80px; height: 80px; font-size: 32px; }

    /* Иконки кнопок (простые символы) */
    .icon-up::after    { content: "▲"; }
    .icon-down::after  { content: "▼"; }
    .icon-left::after   { content: "◀"; }
    .icon-right::after  { content: "▶"; }
    .icon-shoot::after  { content: "🔥"; }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">Убито врагов: <span id="kills">0</span></div>

  <div id="message">
    <span>Нажмите, чтобы начать</span>
  </div>

  <!-- Мобильные кнопки -->
  <div class="mobile-controls">
    <div class="btn-group">
      <div class="btn icon-up"    onmousedown="setMove('forward', true)" onmouseup="setMove('forward', false)"></div>
      <div class="btn icon-down"  onmousedown="setMove('backward', true)" onmouseup="setMove('backward', false)"></div>
      <div class="btn icon-left"  onmousedown="setMove('left', true)" onmouseup="setMove('left', false)"></div>
      <div class="btn icon-right" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)"></div>
    </div>
    <div>
      <div class="btn shoot icon-shoot" onmousedown="shoot()" onmouseup="shootCancel()"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);
    scene.fog = new THREE.Fog(0x111115, 8, 40);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Освещение
    const light = new THREE.HemisphereLight(0xffffff, 0x444466, 2);
    scene.add(light);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(50, 50, 30);
    scene.add(dirLight);

    // Пол
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    floorGeo.rotateX(-Math.PI / 2);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    scene.add(new THREE.Mesh(floorGeo, floorMat));

    // Стены
    function makeWall(x, y, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const wall = new THREE.Mesh(geo, mat);
      wall.position.set(x, y, z);
      scene.add(wall);
    }
    makeWall(0, 1, -25, 50, 2, 1);
    makeWall(0, 1, 25, 50, 2, 1);
    makeWall(-25, 1, 0, 1, 2, 50);
    makeWall(25, 1, 0, 1, 2, 50);

    // Враги
    const enemies = [];
    const enemyGeo = new THREE.BoxGeometry(1, 1, 1);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });

    const MAX_ENEMIES = 5;
    const ARENA_HALF = 22;

    function spawnEnemy() {
      const e = new THREE.Mesh(enemyGeo, enemyMat);
      let x, z, dist;
      do {
        x = (Math.random() - 0.5) * ARENA_HALF * 2;
        z = (Math.random() - 0.5) * ARENA_HALF * 2;
        dist = Math.hypot(x - camera.position.x, z - camera.position.z);
      } while (dist < 6);

      e.position.set(x, 0.5, z);
      e.userData.speed = 2.0 + Math.random() * 1.5;
      enemies.push(e);
      scene.add(e);
    }

    function fillEnemies() {
      while (enemies.length < MAX_ENEMIES) spawnEnemy();
    }
    fillEnemies();

    // Управление
    const controls = new PointerLockControls(camera, document.body);
    const messageEl = document.getElementById('message');

    document.body.addEventListener('click', () => {
      if (!controls.isLocked) controls.lock();
    });

    controls.addEventListener('lock', () => {
      messageEl.style.display = 'none';
    });
    controls.addEventListener('unlock', () => {
      messageEl.style.display = 'flex';
      messageEl.innerText = 'Пауза. Нажмите, чтобы продолжить';
    });

    // Переменные движения
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isShooting = false;

    // Клавиатура (ПК)
    window.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    moveForward = true; break;
        case 'KeyS': case 'ArrowDown':  moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft':  moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
      }
    });
    window.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    moveForward = false; break;
        case 'KeyS': case 'ArrowDown':  moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft':  moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    });

    // Кнопки (мобильные)
    window.setMove = (dir, val) => {
      switch (dir) {
        case 'forward': moveForward = val; break;
        case 'backward': moveBackward = val; break;
        case 'left': moveLeft = val; break;
        case 'right': moveRight = val; break;
      }
    };

    window.shoot = () => { isShooting = true; };
    window.shootCancel = () => { isShooting = false; };

    // Стрельба (мышь + мобильные кнопки)
    const raycaster = new THREE.Vector2();

    const onMouseDown = () => { if (controls.isLocked) shoot(); };
    const onMouseUp = () => { shootCancel(); };

    document.addEventListener('mousedown', onMouseDown);
    document.addEventListener('mouseup', onMouseUp);

    // Игровой цикл
    let velocity = new THREE.Vector3();
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (controls.isLocked) {
        // Движение
        velocity.x = (-moveLeft + moveRight) * 15.0 * dt;
        velocity.z = (-moveForward + moveBackward) * 15.0 * dt;
        controls.moveRight(-velocity.x);
        controls.moveForward(-velocity.z);

        // Ограничение арены
        const p = camera.position;
        p.x = Math.max(-ARENA_HALF, Math.min(ARENA_HALF, p.x));
        p.z = Math.max(-ARENA_HALF, Math.min(ARENA_HALF, p.z));
      }

      // Стрельба
      if (isShooting && controls.isLocked) {
        raycaster.set(0, 0); // из центра экрана
        // Для упрощения используем тот же raycaster из Three.js, но без мышиных координат
        // Здесь мы эмулируем выстрел из центра камеры
        const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const origin = camera.position.clone();
        const ray = new THREE.Ray(origin, direction.normalize());
        const hits = ray.intersectObjects(enemies);

        if (hits.length > 0) {
          const hit = hits[0].object;
          scene.remove(hit);
          enemies.splice(enemies.indexOf(hit), 1);
          document.getElementById('kills').innerText = parseInt(document.getElementById('kills').innerText) + 1;
          spawnEnemy();
          // Небольшая задержка между выстрелами (чтобы не спамило)
          setTimeout(() => {}, 200);
        }
      }

      // Враги преследуют
      const playerPos = camera.position;
      for (const e of enemies) {
        const dx = playerPos.x - e.position.x;
        const dz = playerPos.z - e.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist > 0.01) {
          const speed = e.userData.speed;
          const step = speed * dt;
          e.position.x += (dx / dist) * step;
          e.position.z += (dz / dist) * step;
          e.rotation.y = Math.atan2(dx, dz);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
